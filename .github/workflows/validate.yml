name: Validate Files
on: push
jobs:
  validate_files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate HTML files
        run: test -f index.html

      - name: Validate JS files
        run: test -f script.js

      - name: Validate JS files
        run: node --check script.js
